<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Bãi Giữ Xe Thông Minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/smart_parking.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="branding-col">
            <img src="../static/image/logo.jpg" alt="Logo Bãi Giữ Xe" class="logo">
            <h1 class="brand-title">ĐỔI MẬT KHẨU</h1>
        </div>
        <div class="form-col">
            <form id="changePasswordForm" action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="oldPassword">Mật khẩu cũ</label>
                    <div class="input-wrapper">
                        <input type="password" id="oldPassword" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" required>
                    </div>
                </div>
                <button type="submit" class="btn-login" style="margin-top: 20px;">Đổi Mật Khẩu</button>
                <a href="/dashboard" class="forgot-password" style="display: block; text-align: center; margin-top: 15px;">Quay lại trang chủ</a>
            </form>
        </div>
    </div>
    <script src="../static/smart_parking.js"></script>
</body>
</html>
